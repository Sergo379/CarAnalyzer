[project]
name = "caranalyzer"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "fastapi[standard-no-fastapi-cloud-cli]>=0.141.1",
    "httpx>=0.28.1",
    "lxml>=6.1.3",
    "playwright>=1.63.0",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.3",
]

[project.optional-dependencies]
knowledge = [
    "ddgs>=9.15.0",
    "google-genai>=2.25.0",
    "llama-index-core>=0.14.0",
    "pypdf>=6.0.0",
    "sentence-transformers>=5.0.0",
    "sqlite-vec>=0.1.6",
]
lab = [
    "langfuse>=3.0.0",
    "mlflow>=3.0.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["-p", "no:cacheprovider"]

[tool.ruff]
target-version = "py313"
line-length = 100
exclude = ["pytest-cache-files-*"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
